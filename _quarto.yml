project:
  type: book
  output-dir: docs
  resources:
    - "eu-lattes.jpg"
    - "avatar.png"
  # Compila também as apresentações (slides/) depois do livro
  post-render:
    - ./build-slides.sh

lang: pt-BR
bibliography: referencias.bib

metadata:
  isbn: "978-85-XXXX-X"
  doi: "10.5281/zenodo.23858967"
  
book:
  title: "Análise de Dados para Biocientistas"
  author: "Márcio Souza"
  date: "2026-10-07"
  cover-image: capa.png
  chapters:
    - index.qmd
    - cap01_introducao.qmd
    - cap02_estudos.qmd
    - cap03_amostragem.qmd
    - cap04_aed.qmd
    - cap05_probabilidade.qmd
    - cap06_diagnosticos.qmd
    - cap07_modelos.qmd
    - cap08_hipoteses.qmd
    - cap09_intervalos.qmd
    - cap10_correlacao.qmd
    - referencias.qmd

format:
  html:
    theme: cosmo
    css: custom.css
    include-in-header: 
      - quiz.html
      - perfil.html
    include-after-body: 
      - chat.html
    comments:
      giscus:
        repo: "profmsouzaoficial/estatistica-biocientistas" 
        category: "General"
        mapping: "title"
        reactions-enabled: true

filters:
  - webr
  
webr:
  show-startup-message: false