project:
  type: website
  output-dir: docs
  resources:
    - "eu-lattes.jpg"

lang: pt-BR
bibliography: referencias.bib

website:
  title: "Análise de Dados para Biocientistas"
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - cap01_introducao.qmd
      - cap02_estudos.qmd
      - cap03_amostragem.qmd
      - cap04_aed.qmd
      - cap05_probabilidade.qmd
      - cap06_diagnosticos.qmd
      - cap07_modelos.qmd
      - cap08_hipoteses.qmd
      - cap09_intervalos.qmd
      - cap10_correlacao.qmd
      - referencias.qmd

format:
  html:
    theme: cosmo
    format-links: [revealjs]
    css: custom.css
    include-in-header: 
      - quiz.html
      - perfil.html
    include-after-body: 
      - chat.html
    comments:
      giscus:
        repo: "profmsouzaoficial/estatistica-biocientistas" 
        category: "General"
        mapping: "title"
        reactions-enabled: true
  revealjs:
    output-ext: slide.html
    theme: default
    scrollable: true
    navigation-mode: linear
    controls-layout: bottom-right

filters:
  - webr
  
webr:
  show-startup-message: false