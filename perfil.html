<script>
document.addEventListener("DOMContentLoaded", function() {
    let sidebarTitle = document.querySelector('.sidebar-title');

    if (sidebarTitle && !document.querySelector('.meu-perfil-sidebar')) {
        
        let perfilDiv = document.createElement('div');
        perfilDiv.className = 'meu-perfil-sidebar';
        perfilDiv.style.cssText = 'text-align: left; margin-bottom: 20px; padding-top: 10px;';
        
        perfilDiv.innerHTML = `
            <img src="eu-lattes.jpg" alt="Perfil" style="width: 130px; height: 130px; border-radius: 8px; object-fit: cover; border: 2px solid #2C3E50; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <!-- Painel de Redes Sociais com Alinhamento Flex Centralizado -->
            <div style="margin-top: 15px; display: flex; justify-content: left; align-items: center; gap: 14px; height: 24px;">
                <!-- Lattes (Capelo Acadêmico) -->
                <a href="#" target="_blank" title="Currículo Lattes" style="color: #64748b; font-size: 21px; line-height: 0; transition: 0.2s;" onmouseover="this.style.color='#2C3E50'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-mortarboard-fill"></i>
                </a>
                <!-- LinkedIn -->
                <a href="#" target="_blank" title="LinkedIn" style="color: #64748b; font-size: 19px; line-height: 0; transition: 0.2s;" onmouseover="this.style.color='#0a66c2'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-linkedin"></i>
                </a>
                <!-- GitHub -->
                <a href="#" target="_blank" title="GitHub" style="color: #64748b; font-size: 19px; line-height: 0; transition: 0.2s;" onmouseover="this.style.color='#171515'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-github"></i>
                </a>
                <!-- YouTube -->
                <a href="#" target="_blank" title="YouTube" style="color: #64748b; font-size: 21px; line-height: 0; transition: 0.2s;" onmouseover="this.style.color='#FF0000'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-youtube"></i>
                </a>
                <!-- Instagram -->
                <a href="#" target="_blank" title="Instagram" style="color: #64748b; font-size: 19px; line-height: 0; transition: 0.2s;" onmouseover="this.style.color='#E1306C'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-instagram"></i>
                </a>
            </div>
        `;
        
        sidebarTitle.parentNode.insertBefore(perfilDiv, sidebarTitle);

        let infoDiv = document.createElement('div');
        infoDiv.style.cssText = 'margin-top: 5px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #64748b; line-height: 1.6; text-align: left;';
        
        infoDiv.innerHTML = `
            <div style="font-family: monospace; font-size: 11px;"><strong>ISBN:</strong> 978-X-XXXX-XXXX-X</div>
            <div style="font-family: monospace; font-size: 11px; margin-top: 2px;"><strong>DOI:</strong> <a href="#" style="color: #6A8A9F; text-decoration: none; transition: 0.2s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">10.XXXX/zenodo.XXXXX</a></div>
        `;
        
        sidebarTitle.parentNode.insertBefore(infoDiv, sidebarTitle.nextSibling);
    }
});
</script>
