<script>
document.addEventListener("DOMContentLoaded", function() {
    let sidebarTitle = document.querySelector('.sidebar-title');

    if (sidebarTitle && !document.querySelector('.meu-perfil-sidebar')) {
        let perfilDiv = document.createElement('div');
        perfilDiv.className = 'meu-perfil-sidebar';
        
        perfilDiv.style.cssText = 'text-align: center; margin-top: 25px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0;';
        
        perfilDiv.innerHTML = `
            <!-- Foto Quadrada (com cantos levemente arredondados para acabamento premium) -->
            <img src="eu-lattes.jpg" alt="Márcio Souza" style="width: 130px; height: 130px; border-radius: 8px; object-fit: cover; border: 2px solid #2C3E50; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <!-- Painel de Redes Sociais -->
            <div style="margin-top: 18px; display: flex; justify-content: center; gap: 15px;">
                <!-- Currículo Lattes -->
                <a href="#" target="_blank" title="Currículo Lattes" style="color: #64748b; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='#2C3E50'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-file-earmark-person-fill"></i>
                </a>
                <!-- LinkedIn -->
                <a href="#" target="_blank" title="LinkedIn" style="color: #64748b; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='#0a66c2'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-linkedin"></i>
                </a>
                <!-- GitHub -->
                <a href="#" target="_blank" title="GitHub" style="color: #64748b; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='#171515'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-github"></i>
                </a>
                <!-- Instagram -->
                <a href="#" target="_blank" title="Instagram" style="color: #64748b; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='#E1306C'" onmouseout="this.style.color='#64748b'">
                    <i class="bi bi-instagram"></i>
                </a>
            </div>
        `;
        
        sidebarTitle.parentNode.insertBefore(perfilDiv, sidebarTitle.nextSibling);
    }
});
</script>
