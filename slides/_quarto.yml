project:
  type: default
  output-dir: ../docs/slides

lang: pt-BR

format:
  revealjs:
    # ---- Template (marca visual) -------------------------------------------
    theme:
      - default
      - tema/slides.scss
    include-in-header: tema/fontes.html
    footer: "Análise de Dados para Biocientistas"
    slide-number: true

    # ---- Tela e movimento ---------------------------------------------------
    width: 1280
    height: 720
    margin: 0
    center: false
    transition: fade
    transition-speed: fast
    background-transition: fade

    # ---- Navegação ----------------------------------------------------------
    controls: true
    controls-layout: bottom-right
    controls-tutorial: false
    progress: true
    hash: true
    menu: true

    # ---- Conteúdo -----------------------------------------------------------
    slide-level: 2
    incremental: false
    scrollable: false
    highlight-style: github-dark
    fig-align: center
    pdf-separate-fragments: false

filters:
  - webr

webr:
  show-startup-message: false
  # Pacotes R carregados no início da sessão (WebAssembly)
  packages: ["ggplot2"]
  # Fonte das células de código. A escala é aplicada sobre --r-main-font-size
  # (30px), então 0.75 => 22,5px — legível do fundo da sala.
  cell-options:
    editor-font-scale: "0.75"
    editor-word-wrap: "true"
    editor-max-height: "430"
