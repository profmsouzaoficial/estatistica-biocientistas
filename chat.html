<!-- CSS do Chat do n8n -->
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

<!-- Script de Construção do Chat -->
<script type="module">
import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

createChat({
    webhookUrl: 'SUA_URL_DE_PRODUCAO_AQUI',
    showWelcomeScreen: true,
    initialMessages: [
        'Olá! Sou o seu tutor virtual de Bioestatística. Como posso ajudar com os códigos em R ou com a teoria das aulas de hoje?'
    ],
    i18n: {
        en: {
            title: 'Tutor Virtual 👨‍🔬',
            subtitle: 'Assistência 24h para alunos de Biociências.',
            getStarted: 'Iniciar conversa',
            inputPlaceholder: 'Digite sua dúvida aqui...',
            closeButtonTooltip: 'Fechar tutor'
        }
    }
});
</script>
