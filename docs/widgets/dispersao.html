<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material homogêneo e heterogêneo — mesma amostra, intervalos diferentes</title>
<style>
html,body{margin:0;height:100%;background:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#334155;-webkit-font-smoothing:antialiased}
.w-disp{--w-ink:#0b1220;--w-body:#334155;--w-muted:#64748b;--w-line:#e6ecf5;--w-teal:#0d9488;--w-amber:#d97706;height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;padding:12px 16px 8px;border-radius:14px;color:var(--w-body)}
.w-disp svg{flex:1 1 auto;min-height:0;width:100%}
.w-disp .w-top{flex:0 0 auto}
.w-disp .w-bot{flex:0 0 auto;margin-top:4px}
.w-disp .w-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.w-disp .w-tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--w-teal)}
.w-disp .w-hint{font-size:13px;color:var(--w-muted)}
.w-disp svg{display:block}
.w-disp .w-ax{stroke:#cbd5e1;stroke-width:1.2}
.w-disp .w-tick{fill:#94a3b8;font-size:14px;font-family:inherit}
.w-disp .w-name{fill:#0b1220;font-size:17px;font-weight:700;font-family:inherit}
.w-disp .w-sub{fill:#64748b;font-size:14px;font-family:inherit}
.w-disp .w-stat{fill:#334155;font-size:15px;font-family:inherit}
.w-disp .w-stat b{font-weight:700}
</style>
</head>
<body>
<div class="w-anim w-disp">
  <div class="w-top">
    <span class="w-tag">Simulação</span>
    <span class="w-hint">10 alíquotas de cada material &middot; mesmo método &middot; mesmo n = 10</span>
  </div>
  <svg viewBox="0 0 1000 300" role="img" aria-label="Comparação entre material homogêneo e heterogêneo"></svg>
</div>

<script>
(function () {
  var host = document.querySelector('.w-disp'); if (!host) return;
  var NS = 'http://www.w3.org/2000/svg';
  function mk(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }
  function txt(p, s) { var e = mk('text', p); e.textContent = s; return e; }
  var svg = host.querySelector('svg');
  var L = 96, XR = 620, AXMIN = 88, AXMAX = 118, BX = 652;
  function x(v) { return L + (XR - L) * (v - AXMIN) / (AXMAX - AXMIN); }
  function num(v, d) { return v.toFixed(d).replace('.', ','); }

  var grupos = [
    { nome: 'Material homogêneo', sub: 'soro glicosado 5% bem misturado', cor: '#0d9488',
      vals: [99.5, 99.0, 102.7, 101.4, 102.5, 98.5, 100.2, 101.3, 96.8, 97.9] },
    { nome: 'Material heterogêneo', sub: 'suspensão biológica, sem homogeneizar', cor: '#d97706',
      vals: [92.3, 101.1, 107.2, 92.5, 93.2, 94.1, 104.6, 115.5, 105.5, 94.0] }
  ];

  function stats(vals) {
    var n = vals.length, m = 0, i, s = 0;
    for (i = 0; i < n; i++) m += vals[i]; m /= n;
    for (i = 0; i < n; i++) s += (vals[i] - m) * (vals[i] - m);
    s = Math.sqrt(s / (n - 1));
    var t = 2.262, ep = s / Math.sqrt(n), marg = t * ep;
    return { m: m, s: s, ep: ep, marg: marg, lo: m - marg, hi: m + marg };
  }

  var g = mk('g', {}); svg.appendChild(g);
  [90, 95, 100, 105, 110, 115].forEach(function (v) {
    g.appendChild(mk('line', { x1: x(v), x2: x(v), y1: 34, y2: 272, stroke: v === 100 ? '#c7d2fe' : '#eef2f8', 'stroke-width': v === 100 ? 2 : 1 }));
    g.appendChild(txt({ x: x(v), y: 292, 'class': 'w-tick', 'text-anchor': 'middle' }, v));
  });
  g.appendChild(txt({ x: x(100) + 6, y: 26, 'class': 'w-tick', fill: '#6366f1' }, 'valor verdadeiro = 100'));
  g.appendChild(mk('line', { x1: L, x2: XR, y1: 278, y2: 278, 'class': 'w-ax' }));

  var y0 = [76, 190];
  grupos.forEach(function (gr, k) {
    var st = stats(gr.vals), y = y0[k];
    g.appendChild(txt({ x: 0, y: y - 38, 'class': 'w-name', fill: gr.cor }, gr.nome));
    g.appendChild(txt({ x: 0, y: y - 17, 'class': 'w-sub' }, gr.sub));
    gr.vals.forEach(function (v) {
      g.appendChild(mk('circle', { cx: x(v), cy: y, r: 7, fill: gr.cor, opacity: .9, stroke: '#fff', 'stroke-width': 1.5 }));
    });
    g.appendChild(mk('line', { x1: x(st.m), x2: x(st.m), y1: y - 17, y2: y + 26, stroke: gr.cor, 'stroke-width': 2.5 }));
    g.appendChild(mk('line', { x1: x(st.lo), x2: x(st.hi), y1: y + 40, y2: y + 40, stroke: gr.cor, 'stroke-width': 10, 'stroke-linecap': 'round', opacity: .5 }));
    g.appendChild(mk('line', { x1: x(st.lo), x2: x(st.lo), y1: y + 32, y2: y + 48, stroke: gr.cor, 'stroke-width': 2.5 }));
    g.appendChild(mk('line', { x1: x(st.hi), x2: x(st.hi), y1: y + 32, y2: y + 48, stroke: gr.cor, 'stroke-width': 2.5 }));
    g.appendChild(txt({ x: x(st.hi) + 10, y: y + 46, 'class': 'w-stat', fill: gr.cor, 'font-weight': 700 }, '±' + num(st.marg, 2)));
    g.appendChild(txt({ x: BX, y: y - 22, 'class': 'w-stat' }, 'σ = ' + num(st.s, 1)));
    g.appendChild(txt({ x: BX, y: y - 2, 'class': 'w-stat' }, 'EP = ' + num(st.ep, 2)));
    g.appendChild(txt({ x: BX, y: y + 18, 'class': 'w-stat', fill: gr.cor, 'font-weight': 700 }, 'IC 95%: ' + num(st.lo, 1) + ' – ' + num(st.hi, 1)));
  });
})();
</script>

</body>
</html>
