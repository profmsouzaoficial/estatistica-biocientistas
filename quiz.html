<script>
    document.addEventListener("DOMContentLoaded", function() {

        // 1. Limpeza do Quarto
        document.querySelectorAll('.sourceCode').forEach(function(wrapper) {
            if (wrapper.querySelector('.quizdown') || wrapper.classList.contains('quizdown')) {
                let codeEl = wrapper.querySelector('code');
                let textoPuro = codeEl ? codeEl.textContent : wrapper.textContent;
                let cleanDiv = document.createElement('div');
                cleanDiv.className = 'quizdown';
                cleanDiv.textContent = textoPuro;
                wrapper.replaceWith(cleanDiv);
            }
        });

        document.querySelectorAll('pre.quizdown').forEach(function(pre) {
            let cleanDiv = document.createElement('div');
            cleanDiv.className = 'quizdown';
            cleanDiv.textContent = pre.textContent;
            pre.replaceWith(cleanDiv);
        });

        // 2. Carrega a Biblioteca
        var script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/quizdown.js";
        
        script.onload = function() {
            // 3. Inicializa o Quiz com cores ajustadas e chaves de tradução corretas
            quizdown.init({
                primaryColor: "#2C3E50",     // Azul escuro (Selecionado / Cabeçalho)
                secondaryColor: "#E2E8F0",   // Azul/Cinza BEM CLARO (Fundo das alternativas) -> Garante o contraste!
                locale: "pt",
                translations: {
                    pt: {
                        evaluate: "Verificar resposta",  // Substitui o "Evaluate"
                        retry: "Fazer novamente",        // Substitui o "One more time"
                        solution: "Mostrar solução",
                        hint: "Dica"
                    }
                }
            });

            // 4. AJUSTE DE FONTE E CONTRASTE
            setTimeout(function() {
                document.querySelectorAll('.quizdown').forEach(function(quizEl) {
                    if (quizEl.shadowRoot) {
                        let style = document.createElement('style');
                        style.textContent = `
                            /* Normaliza o título da questão */
                            h1, h2, h3, .title {
                                font-size: 16px !important;
                                font-weight: 600 !important;
                                color: #2C3E50 !important;
                                margin-bottom: 15px !important;
                                line-height: 1.4 !important;
                            }
                            /* Tamanho do texto geral */
                            p, label, span, div {
                                font-size: 14px !important;
                                line-height: 1.5 !important;
                            }
                            /* Garante que a letra dentro dos botões seja sempre escura para leitura */
                            button {
                                font-size: 14px !important;
                                padding: 10px 14px !important;
                                color: #1A252F !important;
                            }
                            /* Efeito de hover suave nos botões */
                            button:hover {
                                filter: brightness(0.95);
                            }
                        `;
                        quizEl.shadowRoot.appendChild(style);
                    }
                });
            }, 600);
        };
        
        document.head.appendChild(script);
    });
</script>
