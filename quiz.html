<script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. Carrega a biblioteca Quizdown dinamicamente (Protege o link contra o Quarto)
        var script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/quizdown.js";
        
        // 2. Só executa a formatação DEPOIS que a biblioteca terminar de carregar
        script.onload = function() {
            
            // Pré-processamento: Transforma os blocos de código do Quarto em <div> normais
            document.querySelectorAll('code').forEach(function(codeNode) {
                if (codeNode.className.includes('quizdown')) {
                    let div = document.createElement('div');
                    div.className = 'quizdown'; 
                    div.textContent = codeNode.textContent; 
                    
                    let parent = codeNode.closest('.sourceCode') || codeNode.closest('pre');
                    if (parent) {
                        parent.replaceWith(div);
                    }
                }
            });

            // Inicialização do Quizdown com as cores da sua capa
            quizdown.init({
                primaryColor: "#2C3E50", 
                secondaryColor: "#6A8A9F", 
                locale: "pt",
                translations: {
                    pt: {
                        check: "Verificar",
                        reset: "Reiniciar",
                        hint: "Dica",
                        show_solution: "Mostrar Solução"
                    }
                }
            });
        };
        
        // Injeta o script na página
        document.head.appendChild(script);
    });
</script>
